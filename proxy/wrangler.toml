# Cloudflare Worker yapılandırması. Yayınlamak için bu klasörde:  npx wrangler deploy
name = "owslab-proxy"
main = "cloudflare-worker.js"
compatibility_date = "2024-09-23"

[vars]
# TKGM'nin eğitim için herkese açık verdiği demo hesap (sitede de görünür).
# Kendi kurumsal hesabınızı kullanacaksanız bu iki satırı silip `npx wrangler secret put TKGM_SIFRE` ile girin.
TKGM_KULLANICI = "cbsdemouser"
TKGM_SIFRE = "q3b8f+r*"
# Worker'ı yalnızca sitenizden çağrılabilir yapmak için (boş bırakılırsa herkese açık):
IZINLI_KOKENLER = "https://erdemalpar.github.io,http://localhost:5197"
